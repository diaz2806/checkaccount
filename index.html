<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="theme-color" content="#F2F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1226" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface-2:#E8EAF3; --ink:#151A33; --muted:#686E8F; --line:#DDE0EC;
  --primary:#2A3BD6; --primary-ink:#FFFFFF; --danger:#D23B4B; --good:#1E9E6A;
  --shadow:0 10px 30px rgba(21,26,51,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1226; --surface:#191D38; --surface-2:#23284A; --ink:#EEF0FA; --muted:#9CA2C4; --line:#2B3055;
    --primary:#7C8BFF; --primary-ink:#0F1226; --danger:#FF6B7A; --good:#4FD39B;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1226; --surface:#191D38; --surface-2:#23284A; --ink:#EEF0FA; --muted:#9CA2C4; --line:#2B3055;
  --primary:#7C8BFF; --primary-ink:#0F1226; --danger:#FF6B7A; --good:#4FD39B;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:10px}
.display{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 18px calc(120px + env(safe-area-inset-bottom,0px))}
.hidden{display:none!important}

/* hero */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.monthnav h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);font-size:1.3rem;line-height:1}
.iconbtn:active{transform:scale(.94)}
.total{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.8rem,13vw,3.8rem);letter-spacing:-.035em;line-height:1;margin:22px 0 6px;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.93rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.sub .up{color:var(--danger);font-weight:600}.sub .down{color:var(--good);font-weight:600}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--surface-2);margin:22px 0 8px;gap:2px}
.stack span{display:block;height:100%;transition:width .35s ease}
@media (prefers-reduced-motion:reduce){.stack span{transition:none}}

/* sections */
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.1rem;font-weight:700;margin:28px 0 10px;letter-spacing:-.01em}
.card{background:var(--surface);border-radius:20px;padding:6px 16px}
.cat-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:0}
.dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem}
.cat-name{font-weight:600;font-size:.97rem}
.meter{height:5px;border-radius:3px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}

.day{color:var(--muted);font-size:.85rem;font-weight:600;margin:18px 4px 6px}
.exp{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .dot{width:40px;height:40px;border-radius:13px;font-size:1.15rem}
.exp .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .m{color:var(--muted);font-size:.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .amt{font-size:1.02rem}

.empty{background:var(--surface);border-radius:20px;padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.linkbtn{color:var(--primary);font-weight:600;padding:8px 2px}
.foot{display:flex;justify-content:center;margin-top:22px}

/* trips */
.trip{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.trip .em{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;font-size:1.6rem}
.trip .t{font-weight:700;font-size:1.05rem}
.trip .m{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;background:var(--primary);color:var(--primary-ink);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.banner{display:flex;align-items:center;gap:10px;background:var(--primary);color:var(--primary-ink);border-radius:16px;padding:10px 14px;margin-top:14px;font-weight:600;font-size:.92rem;width:100%;text-align:left}
.banner span{flex:1}
.banner.warn{background:var(--surface);color:var(--ink);border:2px solid var(--primary)}
.bk p{color:var(--muted);margin:8px 0 14px;font-size:.93rem}
.bk .btn{width:100%;margin-bottom:10px;text-align:left;display:flex;gap:10px;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;padding:8px 0}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border-radius:14px;padding:12px 16px;font-weight:700;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
.tab{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.78rem;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.add{width:64px;height:64px;border-radius:22px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:var(--shadow)}
.add svg{width:30px;height:30px}
.add:active{transform:scale(.95)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,12,30,.42);z-index:20;opacity:0;transition:opacity .2s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop{transition:none}}
.sheet-inner{max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h3{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.15rem}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 6px}
.amount-in{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:3.2rem;letter-spacing:-.03em;width:2ch;min-width:1.2ch;max-width:80%;border:0;background:transparent;text-align:center;padding:0;font-variant-numeric:tabular-nums}
.amount-in::placeholder{color:var(--line)}
.amount-in:focus{outline:none}
.euro{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:2rem;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:14px 0}
.cats label{position:relative}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--surface);font-size:.8rem;font-weight:600;text-align:center;border:2px solid transparent;line-height:1.15}
.cats span b{font-size:1.45rem;line-height:1}
.cats input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.cats input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:9px;border-radius:10px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg input:checked+span{background:var(--primary);color:var(--primary-ink)}
.seg input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.fields{display:grid;gap:10px;margin-top:10px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:4px 14px;min-height:50px}
.field>span{color:var(--muted);font-size:.9rem;font-weight:600;min-width:62px}
.field input,.field select{flex:1;border:0;background:transparent;padding:10px 0;min-width:0;font-size:16px;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{outline:none}
.field:focus-within{box-shadow:0 0 0 2px var(--primary)}
.save{width:100%;margin-top:14px;border-radius:16px;padding:16px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:1.05rem}
.save:disabled{opacity:.45}
.del{width:100%;margin-top:8px;padding:12px;color:var(--danger);font-weight:600}
.emojis{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.emojis label{position:relative}
.emojis input{position:absolute;opacity:0}
.emojis span{width:48px;height:48px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:1.5rem;border:2px solid transparent}
.emojis input:checked+span{border-color:var(--primary)}
.check{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:14px;font-weight:600;margin-top:10px}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.splitbox{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper>span{color:var(--muted);font-weight:600;font-size:.9rem}
.stepper div{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--surface-2);font-size:1.3rem;font-weight:700;line-height:1}
.stepper output{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.5rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.splitres{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
.splitres b{color:var(--ink);font-size:1.05rem}
/* inversión */
.gain,.amt small.gain{color:var(--good)}.loss,.amt small.loss{color:var(--danger)}
.acts3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}.acts3 .btn{padding:12px 6px;font-size:.88rem;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px}
.stat span{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.stat b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.2rem;font-variant-numeric:tabular-nums;margin-top:2px}
.hold .em{font-size:1.4rem}
.chart{background:var(--surface);border-radius:20px;padding:14px 14px 10px;margin-top:18px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;color:var(--muted);font-size:.8rem;font-weight:600;margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.kv:last-child{border-bottom:0}.kv span{color:var(--muted)}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.note{color:var(--muted);font-size:.83rem;margin:8px 4px 0}
.hint{color:var(--muted);font-size:.88rem;margin:6px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app"></main>

<nav class="nav" aria-label="Secciones">
  <div class="nav-inner" role="tablist">
    <button class="tab" role="tab" id="tab-mes" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      Mes
    </button>
    <button class="tab" role="tab" id="tab-viajes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5 3 11l1.5-1.5 7 1 4-4.5c1-1 2.8-1.6 3.5-.9s.1 2.5-.9 3.5l-4.5 4 1 7L14 21l-2.5-7.5"/></svg>
      Viajes
    </button>
    <button class="add" id="btn-add" aria-label="Añadir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" role="tab" id="tab-inv" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 4 4L21 7"/><path d="M15 7h6v6"/></svg>
      Inversión
    </button>
    <button class="tab" role="tab" id="tab-copia" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      Copia
    </button>
  </div>
</nav>

<div class="backdrop hidden" id="backdrop"></div>
<section class="sheet hidden" id="sheet" role="dialog" aria-modal="true"><div class="sheet-inner" id="sheet-body"></div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const CATS=[
  {id:'super',name:'Súper',emoji:'🛒',color:'#22A86E'},
  {id:'comer',name:'Comer fuera',emoji:'🍝',color:'#F07A2E'},
  {id:'ocio',name:'Ocio',emoji:'🎮',color:'#8B5CF6'},
  {id:'transporte',name:'Transporte',emoji:'🚌',color:'#2B8FD6'},
  {id:'compras',name:'Compras',emoji:'🛍️',color:'#EC4F82'},
  {id:'alquiler',name:'Alquiler',emoji:'🔑',color:'#7A5AF0'},
  {id:'casa',name:'Casa',emoji:'🏠',color:'#C39A12'},
  {id:'coche',name:'Coche',emoji:'🚗',color:'#3D6B8C'},
  {id:'futbol',name:'Fútbol',emoji:'⚽',color:'#3FA34D'},
  {id:'tenis',name:'Tenis',emoji:'🎾',color:'#A8B820'},
  {id:'estudios',name:'Estudios',emoji:'📚',color:'#E0A020'},
  {id:'regalos',name:'Regalos',emoji:'🎁',color:'#E0457B'},
  {id:'subs',name:'Suscripciones',emoji:'🔁',color:'#0FA999'},
  {id:'salud',name:'Salud',emoji:'💊',color:'#DC3C4A'},
  {id:'aloja',name:'Alojamiento',emoji:'🛏️',color:'#5A63E8'},
  {id:'otros',name:'Otros',emoji:'✨',color:'#8A93AD'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const TRIP_EMOJIS=['✈️','🏖️','🏔️','🚗','🏙️','⚽','🎉','🚆'];
let eur;try{eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'});eur.format(1000)}catch(e){eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'})}
const money=c=>eur.format((c||0)/100);
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

/* ---------- storage: en este dispositivo ---------- */
const LS='gastos.v1', LSB='gastos.lastBackup';
let docs=new Map();
try{const raw=JSON.parse(localStorage.getItem(LS)||'null');if(raw)(raw.items||[]).forEach(i=>docs.set(i.id,i))}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({items:[...docs.values()]}))}catch(e){toast('No se pudo guardar: memoria llena')}}
function put(item){docs.set(item.id,item);saveLocal();render()}
function removeDoc(id){docs.delete(id);saveLocal();render()}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

const expenses=()=>[...docs.values()].filter(d=>d.kind==='e');
const trips=()=>[...docs.values()].filter(d=>d.kind==='t').sort((a,b)=>b.created-a.created);
const settings=()=>docs.get('settings')||{id:'settings',kind:'s',activeTrip:null};
const activeTrip=()=>{const t=settings().activeTrip;return t&&docs.get(t)?docs.get(t):null};

/* ---------- view state ---------- */
const now=new Date();
const state={tab:'mes',ym:now.getFullYear()+'-'+pad(now.getMonth()+1),trip:null,hold:null};
const monthLabel=ym=>{const [y,m]=ym.split('-').map(Number);const t=new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
const monthShort=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long'})};
const shiftYm=(ym,d)=>{const [y,m]=ym.split('-').map(Number);const n=new Date(y,m-1+d,1);return n.getFullYear()+'-'+pad(n.getMonth()+1)};
function dayLabel(ds){
  const t=todayStr(), y=new Date();y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+pad(y.getMonth()+1)+'-'+pad(y.getDate());
  if(ds===t)return 'Hoy'; if(ds===ys)return 'Ayer';
  const [a,b,c]=ds.split('-').map(Number);
  return new Date(a,b-1,c).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
}
const sum=list=>list.reduce((s,e)=>s+e.amount,0);
function byCat(list){
  const m={};list.forEach(e=>{m[e.cat]=(m[e.cat]||0)+e.amount});
  return Object.entries(m).map(([id,v])=>({cat:CAT[id]||CAT.otros,v})).sort((a,b)=>b.v-a.v);
}
function stackHTML(groups,total){

function expListHTML(list,showTrip=true){

function renderTrips(){

function wire(){
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  on('prev',()=>{state.ym=shiftYm(state.ym,-1);render()});
  on('next',()=>{state.ym=shiftYm(state.ym,1);render()});

  on('toggle-active',()=>{
    const s={...settings()};s.activeTrip=s.activeTrip===state.trip?null:state.trip;put(s);
    toast(s.activeTrip?'Viaje activo':'Viaje terminado');
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openExpense(docs.get(b.dataset.edit)));

  on('backup',openBackup);on('backup-banner',openBackup);
  wireInv(on);
}

/* ---------- inversión ---------- */
const holdings=()=>[...docs.values()].filter(d=>d.kind==='h').sort((a,b)=>(a.type===b.type?a.created-b.created:a.type==='fondo'?-1:1));
const moves=hid=>[...docs.values()].filter(d=>d.kind==='mv'&&d.holding===hid);
const parseEur=str=>{const t=String(str||'').replace(/\s|€/g,'');const v=parseFloat(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t);return isFinite(v)&&v>=0?Math.round(v*100):null};
const toInput=c=>c==null?'':(c/100).toFixed(2).replace('.',',');
const QUICK={
  fondo:{type:'fondo',name:'iShares Developed World',platform:'MyInvestor',isin:'IE000ZYRH0Q7',initial:300000},
  cuenta:{type:'cuenta',name:'Colchón',platform:'Trade Republic',isin:'',initial:null}
};
function calc(h){
  const ms=moves(h.id);
  const aport=sum(ms.filter(m=>m.type==='in')), ret=sum(ms.filter(m=>m.type==='out'));
  const net=aport-ret, value=h.value==null?net:h.value, gain=value-net;
  return {aport,ret,net,value,gain,pct:net>0?gain/net*100:0};
}
function taxOn(gainC){
  const g=gainC/100;if(g<=0)return 0;
  const B=[[6000,.19],[50000,.21],[200000,.23],[300000,.27],[Infinity,.30]];
  let t=0,prev=0;for(const [lim,r] of B){if(g>prev)t+=(Math.min(g,lim)-prev)*r;prev=lim}
  return Math.round(t*100);
}
const signed=c=>(c>0?'+':c<0?'−':'')+money(Math.abs(c));
const pctTxt=p=>(p>0?'+':p<0?'−':'')+Math.abs(p).toLocaleString('es-ES',{maximumFractionDigits:2,minimumFractionDigits:2})+' %';
const cls=c=>c>0?'gain':c<0?'loss':'';
function snapshot(h){
  const c=calc(h), d=todayStr(), hist=(h.history||[]).filter(p=>p.d!==d);
  hist.push({d,v:c.value,n:c.net});hist.sort((a,b)=>a.d<b.d?-1:1);
  return {...h,history:hist};
}
function dueMonthly(){
  const t=new Date(), ym=todayStr().slice(0,7);
  return holdings().filter(h=>h.monthly&&h.monthly.amount>0&&t.getDate()>=(h.monthly.day||1)&&!moves(h.id).some(m=>m.type==='in'&&m.date.slice(0,7)===ym));
}
function projection(valueC,monthlyC,years,r){
  const m=Math.pow(1+r,1/12)-1;let v=valueC/100;
  for(let i=0;i<years*12;i++){v=v*(1+m)+monthlyC/100}
  return Math.round(v*100);
}
function fmtDate(d){const [a,b,c]=d.split('-').map(Number);return new Date(a,b-1,c).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}

function renderInv(){

  <div class="empty" style="margin-top:18px"><b>Apunta aquí tu dinero invertido</b>Registra cada aportación y, de vez en cuando, el valor que te marca la app del banco. Así sabes cuánto has puesto y cuánto has ganado.</div>

  const proj=fVal||monthly?`<h2>Si sigues así</h2><div class="card">
    ${[10,20].map(y=>`<div class="kv"><span>En ${y} años, al 6 % anual</span><b>${money(projection(fVal,monthly,y,.06))}</b></div>`).join('')}

  </div><p class="note">Estimación con ${monthly?money(monthly)+' al mes':'el valor actual, sin aportar más'}. La bolsa no da lo mismo cada año: habrá años malos y buenos.</p>`:'';
  return `<div class="monthnav"><h1 class="display" style="font-size:1.6rem">Inversión</h1><button class="btn primary" id="new-hold">Añadir</button></div>
  ${due.map(h=>`<button class="banner" data-due="${esc(h.id)}"><b>📅</b><span>Toca la aportación de ${money(h.monthly.amount)} a ${esc(h.name)}. ¿La apuntas?</span>›</button>`).join('')}
  ${needBackup()?`<button class="banner warn" id="backup-banner"><b>💾</b><span>Hace tiempo que no guardas una copia</span>›</button>`:''}
  <div class="total">${money(total)}</div>
  <div class="sub"><span>Todo tu dinero apuntado aquí</span></div>
  <div class="stats">
    <div class="stat"><span>Puesto en fondos</span><b>${money(fNet)}</b></div>
    <div class="stat"><span>Ganado en fondos</span><b class="${cls(fGain)}">${signed(fGain)}</b></div>
    <div class="stat"><span>Valen ahora</span><b>${money(fVal)}</b></div>
    <div class="stat"><span>Colchón</span><b>${money(aVal)}</b></div>
  </div>
  ${funds.length?`<h2>Fondos</h2>${funds.map((h,i)=>row(h,F[i])).join('')}`:''}
  ${accs.length?`<h2>Ahorro</h2>${accs.map((h,i)=>row(h,A[i])).join('')}`:''}
  ${proj}`;
}

function chartHTML(h){
  const pts=(h.history||[]);
  if(pts.length<2)return `<div class="chart"><p class="hint" style="margin:0">La gráfica aparece cuando hayas actualizado el valor en dos días distintos. Hazlo una vez al mes, no hace falta más.</p></div>`;
  const W=320,H=130,P=6;
  const t=pts.map(p=>new Date(p.d).getTime()), t0=Math.min(...t), t1=Math.max(...t)||t0+1;
  const all=pts.flatMap(p=>[p.v,p.n]), lo=Math.min(...all)*0.98, hi=Math.max(...all)*1.02||1;
  const x=i=>P+(t1===t0?0:(t[i]-t0)/(t1-t0))*(W-2*P), y=v=>H-P-(v-lo)/(hi-lo||1)*(H-2*P);
  const line=k=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del valor frente a lo puesto">
    <path d="${line('n')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="${line('v')}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </svg><div class="legend"><span><i style="background:var(--primary)"></i>Lo que vale</span><span><i style="background:var(--muted)"></i>Lo que has puesto</span></div></div>`;
}

function renderHolding(h){
  const c=calc(h), fondo=h.type==='fondo';
  const ms=moves(h.id).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.created-a.created);
  const tax=taxOn(c.gain);
  return `<button class="back" id="back-inv">‹ Inversión</button>
  <div class="monthnav" style="margin-top:4px"><h1 class="display" style="font-size:1.4rem">${fondo?'📈':'🛟'} ${esc(h.name)}</h1><button class="iconbtn" id="edit-hold" aria-label="Editar">✎</button></div>
  <div class="total">${money(c.value)}</div>
  <div class="sub"><span>${fondo?'Valor':'Saldo'} a ${h.valueDate?fmtDate(h.valueDate):'hoy'}</span>${c.net?`<span class="${c.gain>0?'down':c.gain<0?'up':''}">${signed(c.gain)} (${pctTxt(c.pct)})</span>`:''}</div>
  <div class="acts3">
    <button class="btn primary" id="mv-in">Aportar</button>
    <button class="btn" id="upd-val">Actualizar</button>
    <button class="btn" id="mv-out">Retirar</button>
  </div>
  ${chartHTML(h)}
  <h2>Resumen</h2><div class="card">
    <div class="kv"><span>Has puesto</span><b>${money(c.aport)}</b></div>
    ${c.ret?`<div class="kv"><span>Has sacado</span><b>${money(c.ret)}</b></div>`:''}
    <div class="kv"><span>${fondo?'Ganancia':'Intereses'}</span><b class="${cls(c.gain)}">${signed(c.gain)}</b></div>
    ${h.platform?`<div class="kv"><span>Dónde</span><b>${esc(h.platform)}</b></div>`:''}
    ${h.isin?`<div class="kv"><span>ISIN</span><b>${esc(h.isin)}</b></div>`:''}
    ${h.monthly&&h.monthly.amount?`<div class="kv"><span>Aportación mensual</span><b>${money(h.monthly.amount)}, día ${h.monthly.day}</b></div>`:''}
  </div>
  ${fondo&&c.gain>0?`<h2>Si lo vendieras todo hoy</h2><div class="card">
    <div class="kv"><span>Impuestos aprox.</span><b>${money(tax)}</b></div>
    <div class="kv"><span>Te quedarían</span><b>${money(c.value-tax)}</b></div>
  </div><p class="note">Solo se paga por lo ganado: 19 % hasta 6.000 € de ganancia, 21 % hasta 50.000 €. Mientras no vendas, no pagas nada.</p>`:''}
  <h2>Movimientos</h2>
  ${ms.length?`<div class="card">${ms.map(m=>`<button class="exp" data-mv="${esc(m.id)}"><div class="dot" style="background:var(--surface-2)">${m.type==='in'?'➕':'➖'}</div><div style="min-width:0"><div class="t">${m.type==='in'?'Aportación':'Retirada'}</div><div class="m">${esc(fmtDate(m.date)+(m.note?' · '+m.note:''))}</div></div><div class="amt ${m.type==='in'?'':'loss'}">${m.type==='in'?'+':'−'}${money(m.amount)}</div></button>`).join('')}</div>`
  :`<div class="empty"><b>Sin movimientos</b>Apunta tu primera aportación con el botón de arriba.</div>`}`;
}

function wireInv(on){
  on('q-fondo',()=>openHolding(null,QUICK.fondo));
  on('q-cuenta',()=>openHolding(null,QUICK.cuenta));
  on('q-otro',()=>openHolding(null,{type:'fondo',name:'',platform:'',isin:'',initial:null}));
  on('new-hold',()=>openHolding(null,{type:'fondo',name:'',platform:'',isin:'',initial:null}));
  on('back-inv',()=>{state.hold=null;render()});
  const cur=()=>state.hold&&docs.get(state.hold);
  on('edit-hold',()=>openHolding(cur()));
  on('mv-in',()=>openMove(cur(),null,'in'));
  on('mv-out',()=>openMove(cur(),null,'out'));
  on('upd-val',()=>openValue(cur()));
  document.querySelectorAll('[data-hold]').forEach(b=>b.onclick=()=>{state.hold=b.dataset.hold;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const m=docs.get(b.dataset.mv);openMove(docs.get(m.holding),m,m.type)});
  document.querySelectorAll('[data-due]').forEach(b=>b.onclick=()=>{const h=docs.get(b.dataset.due);openMove(h,null,'in',h.monthly.amount)});
}

function openHolding(h,preset){
  const edit=!!h, d=h||preset;
  openSheet(`
  <div class="sheet-head"><h3>${edit?'Editar':'Nuevo'}</h3><button class="iconbtn" id="x" aria-label="Cerrar">✕</button></div>
  <div class="seg" role="radiogroup" aria-label="Tipo" style="margin-top:12px">
    <label><input type="radio" name="htype" value="fondo" ${d.type==='fondo'?'checked':''}><span>📈 Fondo</span></label>
    <label><input type="radio" name="htype" value="cuenta" ${d.type!=='fondo'?'checked':''}><span>🛟 Cuenta de ahorro</span></label>
  </div>
  <div class="fields">
    <label class="field"><span>Nombre</span><input id="hname" maxlength="50" placeholder="iShares Developed World, Colchón…" value="${esc(d.name)}"></label>
    <label class="field"><span>Dónde</span><input id="hplat" maxlength="30" placeholder="MyInvestor, Trade Republic…" value="${esc(d.platform)}"></label>
    <label class="field fondo-only"><span>ISIN</span><input id="hisin" maxlength="20" autocapitalize="characters" placeholder="Opcional" value="${esc(d.isin)}"></label>
    ${edit?'':`<label class="field"><span>Puesto</span><input id="hinit" inputmode="decimal" placeholder="Lo que has metido ya, en €" value="${toInput(d.initial)}"></label>
    <label class="field"><span>Fecha</span><input id="hdate" type="date" value="${todayStr()}"></label>`}
    <label class="field fondo-only"><span>Al mes</span><input id="hmon" inputmode="decimal" placeholder="Aportación mensual, opcional" value="${toInput(d.monthly&&d.monthly.amount)}"></label>
    <label class="field fondo-only"><span>Día</span><input id="hday" type="number" min="1" max="28" inputmode="numeric" placeholder="Día del mes que aportas" value="${d.monthly?d.monthly.day:''}"></label>
  </div>
  ${edit?'':'<p class="hint">Si acabas de dar la orden y aún no se ha ejecutado, apunta igualmente lo que has metido. El valor lo actualizas cuando aparezca en el banco.</p>'}
  <button class="save" id="save">${edit?'Guardar cambios':'Guardar'}</button>
  ${edit?'<button class="del" id="del">Borrar con todos sus movimientos</button>':''}`);
  const sync=()=>{const f=document.querySelector('input[name=htype]:checked').value==='fondo';document.querySelectorAll('.fondo-only').forEach(el=>el.classList.toggle('hidden',!f))};
  document.querySelectorAll('input[name=htype]').forEach(r=>r.onchange=sync);sync();
  $('x').onclick=closeSheet;
  $('save').onclick=()=>{
    const name=$('hname').value.trim();if(!name){toast('Ponle un nombre');$('hname').focus();return}
    const type=document.querySelector('input[name=htype]:checked').value;
    const mon=type==='fondo'?parseEur($('hmon').value):null, day=Math.min(28,Math.max(1,parseInt($('hday').value)||1));
    let item={...(h||{}),id:edit?h.id:uid('h'),kind:'h',type,name,platform:$('hplat').value.trim(),isin:type==='fondo'?$('hisin').value.trim().toUpperCase():'',
      monthly:mon?{amount:mon,day}:null,created:edit?h.created:Date.now()};
    if(!edit){
      const init=parseEur($('hinit').value);
      docs.set(item.id,item);
      if(init){const mv={id:uid('m'),kind:'mv',holding:item.id,type:'in',amount:init,date:$('hdate').value||todayStr(),note:'Inicial',created:Date.now()};docs.set(mv.id,mv)}
      item={...item,value:init||0,valueDate:todayStr()};item=snapshot(item);
    }
    put(item);closeSheet();state.tab='inv';state.hold=item.id;render();toast(edit?'Cambios guardados':'Guardado');
  };
  if(edit)$('del').onclick=()=>{
    if(!confirm('¿Borrar '+h.name+' y todos sus movimientos?'))return;
    moves(h.id).forEach(m=>docs.delete(m.id));docs.delete(h.id);saveLocal();
    state.hold=null;closeSheet();render();toast('Borrado');
  };
}

function openMove(h,mv,type,prefill){
  const edit=!!mv, hs=holdings();
  if(!hs.length)return openHolding(null,QUICK.fondo);
  const cur=h||hs[0];
  openSheet(`
  <div class="sheet-head"><h3>${edit?'Editar movimiento':type==='out'?'Nueva retirada':'Nueva aportación'}</h3><button class="iconbtn" id="x" aria-label="Cerrar">✕</button></div>
  <div class="amount-wrap"><input class="amount-in" id="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Importe en euros" value="${toInput(edit?mv.amount:prefill)}"><span class="euro">€</span></div>
  <div class="seg" role="radiogroup" aria-label="Tipo">
    <label><input type="radio" name="mtype" value="in" ${type!=='out'?'checked':''}><span>➕ Aportación</span></label>
    <label><input type="radio" name="mtype" value="out" ${type==='out'?'checked':''}><span>➖ Retirada</span></label>
  </div>
  <div class="fields">
    ${hs.length>1&&!edit?`<label class="field"><span>En</span><select id="mhold">${hs.map(x=>`<option value="${esc(x.id)}" ${x.id===cur.id?'selected':''}>${x.type==='fondo'?'📈':'🛟'} ${esc(x.name)}</option>`).join('')}</select></label>`:''}
    <label class="field"><span>Fecha</span><input id="mdate" type="date" value="${edit?mv.date:todayStr()}"></label>
    <label class="field"><span>Nota</span><input id="mnote" maxlength="60" placeholder="Opcional" value="${esc(edit?mv.note:'')}"></label>
  </div>
  <p class="hint">El valor del ${cur.type==='fondo'?'fondo':'saldo'} se ajusta solo con este importe. Luego, cuando quieras, pon el valor exacto con "Actualizar".</p>
  <button class="save" id="save" disabled>Guardar</button>
  ${edit?'<button class="del" id="del">Borrar movimiento</button>':''}`);
  const amt=$('amount');
  const size=()=>{amt.style.width=(Math.max(amt.value.length,1)*0.62+0.3)+'em'};
  const check=()=>{$('save').disabled=!parseEur(amt.value)};
  amt.oninput=()=>{check();size()};check();size();amt.focus();
  $('x').onclick=closeSheet;
  const apply=(hold,delta)=>{let x={...hold,value:(hold.value==null?calc(hold).net:hold.value)+delta,valueDate:todayStr()};docs.set(x.id,x);return x};
  const eff=m=>m?(m.type==='in'?m.amount:-m.amount):0;
  $('save').onclick=()=>{
    const cents=parseEur(amt.value);if(!cents)return;
    const t=document.querySelector('input[name=mtype]:checked').value;
    const hid=edit?mv.holding:($('mhold')?$('mhold').value:cur.id);
    const item={id:edit?mv.id:uid('m'),kind:'mv',holding:hid,type:t,amount:cents,date:$('mdate').value||todayStr(),note:$('mnote').value.trim(),created:edit?mv.created:Date.now()};
    docs.set(item.id,item);
    let hold=apply(docs.get(hid),eff(item)-eff(edit?mv:null));
    hold=snapshot(hold);
    put(hold);closeSheet();state.tab='inv';state.hold=hid;render();toast(t==='in'?'Aportación guardada':'Retirada guardada');
  };
  if(edit)$('del').onclick=()=>{
    if(!confirm('¿Borrar este movimiento?'))return;
    docs.delete(mv.id);
    put(snapshot(apply(docs.get(mv.holding),-eff(mv))));closeSheet();toast('Movimiento borrado');
  };
}

function openValue(h){
  const c=calc(h), fondo=h.type==='fondo';
  openSheet(`
  <div class="sheet-head"><h3>${fondo?'Valor actual':'Saldo actual'}</h3><button class="iconbtn" id="x" aria-label="Cerrar">✕</button></div>
  <div class="amount-wrap"><input class="amount-in" id="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Valor en euros" value="${toInput(c.value)}"><span class="euro">€</span></div>
  <p class="hint" style="text-align:center">${fondo?'Copia el "valor de mercado" que te marca '+esc(h.platform||'tu banco')+' para este fondo.':'Copia el saldo que te marca '+esc(h.platform||'tu banco')+', con los intereses.'}</p>
  <button class="save" id="save">Guardar</button>`);
  const amt=$('amount');
  const size=()=>{amt.style.width=(Math.max(amt.value.length,1)*0.62+0.3)+'em'};
  amt.oninput=size;size();amt.focus();amt.select();
  $('x').onclick=closeSheet;
  $('save').onclick=()=>{
    const v=parseEur(amt.value);if(v==null){toast('Escribe un importe');return}
    put(snapshot({...h,value:v,valueDate:todayStr()}));closeSheet();toast(fondo?'Valor actualizado':'Saldo actualizado');
  };
}

let toastT;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800)}

/* ---------- copia de seguridad ---------- */
function lastBackup(){try{return Number(localStorage.getItem(LSB))||0}catch(e){return 0}}
function needBackup(){
  const ex=[...docs.values()].filter(d=>d.kind==='e'||d.kind==='mv'||d.kind==='h');if(ex.length<5)return false;
  const lb=lastBackup(), oldest=Math.min(...ex.map(e=>e.created||Date.now()));
  return Date.now()-(lb||oldest)>30*864e5;
}
async function shareOrDownload(name,text,type){
  const blob=new Blob([text],{type});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  return true;
}
async function exportBackup(){
  const d=new Date(),stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const ok=await shareOrDownload('gastos-copia-'+stamp+'.json',JSON.stringify({app:'gastos',version:1,exported:d.toISOString(),items:[...docs.values()]}),'application/json');
  if(ok){try{localStorage.setItem(LSB,String(Date.now()))}catch(e){}closeSheet();render();toast('Copia creada')}
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;try{data=JSON.parse(r.result)}catch(e){toast('Ese archivo no es una copia válida');return}
    const items=(data&&Array.isArray(data.items))?data.items:null;
    if(!items||data.app!=='gastos'){toast('Ese archivo no es una copia de Gastos');return}
    const n=items.filter(i=>i&&i.kind==='e').length, ni=items.filter(i=>i&&i.kind==='mv').length;
    if(!confirm('Se importarán '+n+' gastos y '+ni+' movimientos de inversión. Lo que ya tengas se mantiene. ¿Continuar?'))return;
    items.forEach(i=>{if(i&&i.id&&i.kind){if(i.id==='settings'&&docs.has('settings'))return;docs.set(i.id,i)}});
    saveLocal();closeSheet();render();toast('Copia recuperada');
  };
  r.readAsText(file);
}
async function exportCsv(){
  const list=expenses().sort((a,b)=>a.date<b.date?-1:1);
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Fecha','Categoría','Nota','Pago','Viaje','Reparto','Importe'].join(';')].concat(list.map(e=>[e.date,q((CAT[e.cat]||CAT.otros).name),q(e.note),e.pay==='cash'?'Efectivo':'Tarjeta',q(e.trip&&docs.get(e.trip)?docs.get(e.trip).name:''),e.split?q((e.split.total/100).toFixed(2).replace('.',',')+' ÷ '+e.split.n):'',(e.amount/100).toFixed(2).replace('.',',')].join(';')));
  await shareOrDownload('gastos.csv','\ufeff'+rows.join('\n'),'text/csv');
}
function openBackup(){
  const lb=lastBackup();
  openSheet(`<div class="bk">
  <div class="sheet-head"><h3>Copia de seguridad</h3><button class="iconbtn" id="x" aria-label="Cerrar">✕</button></div>
  <p>Tus gastos e inversiones se guardan solo en este iPhone. Guarda una copia en Archivos o iCloud Drive de vez en cuando por si borras la app o cambias de móvil.<br><br>${lb?'Última copia: '+new Date(lb).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'Aún no has hecho ninguna copia.'}</p>
  <button class="btn primary" id="bk-export">💾 Guardar copia</button>
  <label class="btn" for="bk-file" style="cursor:pointer">📥 Recuperar desde una copia</label>
  <input type="file" id="bk-file" accept=".json,application/json" class="hidden">
  <button class="btn" id="bk-csv">📊 Exportar todo en CSV (Excel)</button>
  </div>`);
  $('x').onclick=closeSheet;
  $('bk-export').onclick=exportBackup;
  $('bk-csv').onclick=exportCsv;
  $('bk-file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f)};
}

$('tab-mes').onclick=()=>{state.tab='mes';render();window.scrollTo(0,0)};
$('tab-viajes').onclick=()=>{state.tab='viajes';state.trip=null;render();window.scrollTo(0,0)};
$('tab-inv').onclick=()=>{state.tab='inv';state.hold=null;render();window.scrollTo(0,0)};
$('tab-copia').onclick=()=>openBackup();
$('btn-add').onclick=()=>{
  if(state.tab!=='inv')return openExpense();
  const hs=holdings();
  if(!hs.length)return openHolding(null,QUICK.fondo);
  openMove(state.hold?docs.get(state.hold):(hs.length===1?hs[0]:null),null,'in');
};

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();

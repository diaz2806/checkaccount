<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="theme-color" content="#F2F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1226" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface-2:#E8EAF3; --ink:#151A33; --muted:#686E8F; --line:#DDE0EC;
  --primary:#2A3BD6; --primary-ink:#FFFFFF; --danger:#D23B4B; --good:#1E9E6A;
  --shadow:0 10px 30px rgba(21,26,51,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1226; --surface:#191D38; --surface-2:#23284A; --ink:#EEF0FA; --muted:#9CA2C4; --line:#2B3055;
    --primary:#7C8BFF; --primary-ink:#0F1226; --danger:#FF6B7A; --good:#4FD39B;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1226; --surface:#191D38; --surface-2:#23284A; --ink:#EEF0FA; --muted:#9CA2C4; --line:#2B3055;
  --primary:#7C8BFF; --primary-ink:#0F1226; --danger:#FF6B7A; --good:#4FD39B;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:10px}
.display{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 18px calc(120px + env(safe-area-inset-bottom,0px))}
.hidden{display:none!important}

/* hero */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.monthnav h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);font-size:1.3rem;line-height:1}
.iconbtn:active{transform:scale(.94)}
.total{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.8rem,13vw,3.8rem);letter-spacing:-.035em;line-height:1;margin:22px 0 6px;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.93rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.sub .up{color:var(--danger);font-weight:600}.sub .down{color:var(--good);font-weight:600}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--surface-2);margin:22px 0 8px;gap:2px}
.stack span{display:block;height:100%;transition:width .35s ease}
@media (prefers-reduced-motion:reduce){.stack span{transition:none}}

/* sections */
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.1rem;font-weight:700;margin:28px 0 10px;letter-spacing:-.01em}
.card{background:var(--surface);border-radius:20px;padding:6px 16px}
.cat-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:0}
.dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem}
.cat-name{font-weight:600;font-size:.97rem}
.meter{height:5px;border-radius:3px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}

.day{color:var(--muted);font-size:.85rem;font-weight:600;margin:18px 4px 6px}
.exp{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .dot{width:40px;height:40px;border-radius:13px;font-size:1.15rem}
.exp .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .m{color:var(--muted);font-size:.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .amt{font-size:1.02rem}

.empty{background:var(--surface);border-radius:20px;padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.linkbtn{color:var(--primary);font-weight:600;padding:8px 2px}
.foot{display:flex;justify-content:center;margin-top:22px}

/* trips */
.trip{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.trip .em{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;font-size:1.6rem}
.trip .t{font-weight:700;font-size:1.05rem}
.trip .m{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;background:var(--primary);color:var(--primary-ink);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.banner{display:flex;align-items:center;gap:10px;background:var(--primary);color:var(--primary-ink);border-radius:16px;padding:10px 14px;margin-top:14px;font-weight:600;font-size:.92rem;width:100%;text-align:left}
.banner span{flex:1}
.banner.warn{background:var(--surface);color:var(--ink);border:2px solid var(--primary)}
.bk p{color:var(--muted);margin:8px 0 14px;font-size:.93rem}
.bk .btn{width:100%;margin-bottom:10px;text-align:left;display:flex;gap:10px;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;padding:8px 0}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border-radius:14px;padding:12px 16px;font-weight:700;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:10}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;height:64px}
.tab{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.78rem;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.add{width:64px;height:64px;border-radius:22px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:var(--shadow)}
.add svg{width:30px;height:30px}
.add:active{transform:scale(.95)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,12,30,.42);z-index:20;opacity:0;transition:opacity .2s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop{transition:none}}
.sheet-inner{max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h3{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.15rem}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 6px}
.amount-in{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:3.2rem;letter-spacing:-.03em;width:2ch;min-width:1.2ch;max-width:80%;border:0;background:transparent;text-align:center;padding:0;font-variant-numeric:tabular-nums}
.amount-in::placeholder{color:var(--line)}
.amount-in:focus{outline:none}
.euro{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:2rem;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:14px 0}
.cats label{position:relative}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--surface);font-size:.8rem;font-weight:600;text-align:center;border:2px solid transparent;line-height:1.15}
.cats span b{font-size:1.45rem;line-height:1}
.cats input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.cats input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:9px;border-radius:10px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg input:checked+span{background:var(--primary);color:var(--primary-ink)}
.seg input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.fields{display:grid;gap:10px;margin-top:10px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:4px 14px;min-height:50px}
.field>span{color:var(--muted);font-size:.9rem;font-weight:600;min-width:62px}
.field input,.field select{flex:1;border:0;background:transparent;padding:10px 0;min-width:0;font-size:16px;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{outline:none}
.field:focus-within{box-shadow:0 0 0 2px var(--primary)}
.save{width:100%;margin-top:14px;border-radius:16px;padding:16px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:1.05rem}
.save:disabled{opacity:.45}
.del{width:100%;margin-top:8px;padding:12px;color:var(--danger);font-weight:600}
.emojis{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.emojis label{position:relative}
.emojis input{position:absolute;opacity:0}
.emojis span{width:48px;height:48px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:1.5rem;border:2px solid transparent}
.emojis input:checked+span{border-color:var(--primary)}
.check{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:14px;font-weight:600;margin-top:10px}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.splitbox{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper>span{color:var(--muted);font-weight:600;font-size:.9rem}
.stepper div{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--surface-2);font-size:1.3rem;font-weight:700;line-height:1}
.stepper output{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.5rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.splitres{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
.splitres b{color:var(--ink);font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app"></main>

<nav class="nav" aria-label="Secciones">
  <div class="nav-inner" role="tablist">
    <button class="tab" role="tab" id="tab-mes" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      Mes
    </button>
    <button class="add" id="btn-add" aria-label="Añadir gasto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" role="tab" id="tab-viajes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5 3 11l1.5-1.5 7 1 4-4.5c1-1 2.8-1.6 3.5-.9s.1 2.5-.9 3.5l-4.5 4 1 7L14 21l-2.5-7.5"/></svg>
      Viajes
    </button>
  </div>
</nav>

<div class="backdrop hidden" id="backdrop"></div>
<section class="sheet hidden" id="sheet" role="dialog" aria-modal="true"><div class="sheet-inner" id="sheet-body"></div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const CATS=[
  {id:'super',name:'Súper',emoji:'🛒',color:'#22A86E'},
  {id:'comer',name:'Comer fuera',emoji:'🍝',color:'#F07A2E'},
  {id:'ocio',name:'Ocio',emoji:'🎮',color:'#8B5CF6'},
  {id:'transporte',name:'Transporte',emoji:'🚌',color:'#2B8FD6'},
  {id:'compras',name:'Compras',emoji:'🛍️',color:'#EC4F82'},
  {id:'alquiler',name:'Alquiler',emoji:'🔑',color:'#7A5AF0'},
  {id:'casa',name:'Casa',emoji:'🏠',color:'#C39A12'},
  {id:'coche',name:'Coche',emoji:'🚗',color:'#3D6B8C'},
  {id:'futbol',name:'Fútbol',emoji:'⚽',color:'#3FA34D'},
  {id:'tenis',name:'Tenis',emoji:'🎾',color:'#A8B820'},
  {id:'estudios',name:'Estudios',emoji:'📚',color:'#E0A020'},
  {id:'regalos',name:'Regalos',emoji:'🎁',color:'#E0457B'},
  {id:'subs',name:'Suscripciones',emoji:'🔁',color:'#0FA999'},
  {id:'salud',name:'Salud',emoji:'💊',color:'#DC3C4A'},
  {id:'aloja',name:'Alojamiento',emoji:'🛏️',color:'#5A63E8'},
  {id:'otros',name:'Otros',emoji:'✨',color:'#8A93AD'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const TRIP_EMOJIS=['✈️','🏖️','🏔️','🚗','🏙️','⚽','🎉','🚆'];
const eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const money=c=>eur.format((c||0)/100);
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

/* ---------- storage: en este dispositivo ---------- */
const LS='gastos.v1', LSB='gastos.lastBackup';
let docs=new Map();
try{const raw=JSON.parse(localStorage.getItem(LS)||'null');if(raw)(raw.items||[]).forEach(i=>docs.set(i.id,i))}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({items:[...docs.values()]}))}catch(e){toast('No se pudo guardar: memoria llena')}}
function put(item){docs.set(item.id,item);saveLocal();render()}
function removeDoc(id){docs.delete(id);saveLocal();render()}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

const expenses=()=>[...docs.values()].filter(d=>d.kind==='e');
const trips=()=>[...docs.values()].filter(d=>d.kind==='t').sort((a,b)=>b.created-a.created);
const settings=()=>docs.get('settings')||{id:'settings',kind:'s',activeTrip:null};
const activeTrip=()=>{const t=settings().activeTrip;return t&&docs.get(t)?docs.get(t):null};

/* ---------- view state ---------- */
const now=new Date();
const state={tab:'mes',ym:now.getFullYear()+'-'+pad(now.getMonth()+1),trip:null};
const monthLabel=ym=>{const [y,m]=ym.split('-').map(Number);const t=new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
const monthShort=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long'})};
const shiftYm=(ym,d)=>{const [y,m]=ym.split('-').map(Number);const n=new Date(y,m-1+d,1);return n.getFullYear()+'-'+pad(n.getMonth()+1)};
function dayLabel(ds){
  const t=todayStr(), y=new Date();y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+pad(y.getMonth()+1)+'-'+pad(y.getDate());
  if(ds===t)return 'Hoy'; if(ds===ys)return 'Ayer';
  const [a,b,c]=ds.split('-').map(Number);
  return new Date(a,b-1,c).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
}
const sum=list=>list.reduce((s,e)=>s+e.amount,0);
function byCat(list){
  const m={};list.forEach(e=>{m[e.cat]=(m[e.cat]||0)+e.amount});
  return Object.entries(m).map(([id,v])=>({cat:CAT[id]||CAT.otros,v})).sort((a,b)=>b.v-a.v);
}
function stackHTML(groups,total){
  if(!total)return '<div class="stack" aria-hidden="true"></div>';
  return '<div class="stack" role="img" aria-label="Reparto por categorías">'+groups.map(g=>`<span style="width:${(g.v/total*100).toFixed(2)}%;background:${g.cat.color}"></span>`).join('')+'</div>';
}
function catListHTML(groups,total){
  return '<div class="card">'+groups.map(g=>`<div class="cat-row"><div class="dot" style="background:color-mix(in srgb,${g.cat.color} 18%,transparent)">${g.cat.emoji}</div><div><div class="cat-name">${g.cat.name}</div><div class="meter"><i style="width:${(g.v/total*100).toFixed(1)}%;background:${g.cat.color}"></i></div></div><div class="amt">${money(g.v)}<small>${Math.round(g.v/total*100)}%</small></div></div>`).join('')+'</div>';
}
function expListHTML(list,showTrip=true){
  const sorted=[...list].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.created-a.created);
  const days={};sorted.forEach(e=>{(days[e.date]=days[e.date]||[]).push(e)});
  return Object.entries(days).map(([d,items])=>`<div class="day">${dayLabel(d)}</div><div class="card">`+items.map(e=>{
    const c=CAT[e.cat]||CAT.otros;const tr=e.trip&&docs.get(e.trip);
    const meta=[e.split?'Reparto '+money(e.split.total)+' ÷ '+e.split.n:null,e.pay==='cash'?'Efectivo':'Tarjeta',showTrip&&tr?tr.emoji+' '+tr.name:null,e.note?c.name:null].filter(Boolean).join(' · ');
    return `<button class="exp" data-edit="${esc(e.id)}"><div class="dot" style="background:color-mix(in srgb,${c.color} 18%,transparent)">${c.emoji}</div><div style="min-width:0"><div class="t">${esc(e.note||c.name)}</div><div class="m">${esc(meta)}</div></div><div class="amt">${money(e.amount)}</div></button>`;
  }).join('')+'</div>').join('');
}

/* ---------- screens ---------- */
function renderMonth(){
  const list=expenses().filter(e=>e.date.slice(0,7)===state.ym);
  const total=sum(list);
  const prevYm=shiftYm(state.ym,-1);
  const prev=sum(expenses().filter(e=>e.date.slice(0,7)===prevYm));
  const cash=sum(list.filter(e=>e.pay==='cash'));
  const groups=byCat(list);
  let cmp='';
  if(prev&&total){const p=Math.round((total-prev)/prev*100);cmp=`<span class="${p>0?'up':'down'}">${p>0?'+':''}${p}% vs ${monthShort(prevYm)}</span>`}
  const at=activeTrip();
  return `
  <div class="monthnav">
    <button class="iconbtn" id="prev" aria-label="Mes anterior">‹</button>
    <h1 class="display">${monthLabel(state.ym)}</h1>
    <button class="iconbtn" id="next" aria-label="Mes siguiente">›</button>
  </div>
  ${at?`<button class="banner" data-trip="${esc(at.id)}"><b>${at.emoji}</b><span>Estás en ${esc(at.name)}: los gastos nuevos van a este viaje</span>›</button>`:''}
  ${needBackup()?`<button class="banner warn" id="backup-banner"><b>💾</b><span>Hace tiempo que no guardas una copia de tus gastos</span>›</button>`:''}
  <div class="total">${money(total)}</div>
  <div class="sub"><span>${list.length} ${list.length===1?'gasto':'gastos'}</span>${cash?`<span>${money(cash)} en efectivo</span>`:''}${cmp}</div>
  ${stackHTML(groups,total)}
  ${list.length?`<h2>A dónde va</h2>${catListHTML(groups,total)}<h2>Movimientos</h2>${expListHTML(list)}`
  :`<div class="empty" style="margin-top:24px"><b>Sin gastos en ${monthShort(state.ym)}</b>Pulsa + para apuntar el primero.</div>`}
  <div class="foot"><button class="linkbtn" id="backup">Copia de seguridad</button></div>`;
}
function renderTrips(){
  const ts=trips(), at=activeTrip();
  return `<div class="monthnav"><h1 class="display" style="font-size:1.6rem">Viajes</h1><button class="btn primary" id="new-trip">Nuevo viaje</button></div>
  <div style="margin-top:18px">${ts.length?ts.map(t=>{
    const l=expenses().filter(e=>e.trip===t.id);
    return `<button class="trip" data-trip="${esc(t.id)}"><div class="em">${t.emoji}</div><div style="min-width:0"><div class="t">${esc(t.name)}${at&&at.id===t.id?'<span class="pill">Activo</span>':''}</div><div class="m">${l.length} ${l.length===1?'gasto':'gastos'}</div></div><div class="amt">${money(sum(l))}</div></button>`}).join('')
  :`<div class="empty"><b>Aún no tienes viajes</b>Crea uno y márcalo como activo: todo lo que apuntes irá a ese viaje hasta que lo termines.</div>`}</div>`;
}
function renderTrip(t){
  const list=expenses().filter(e=>e.trip===t.id), total=sum(list), groups=byCat(list), at=activeTrip();
  const dates=list.map(e=>e.date).sort();
  const fmt=d=>{const [a,b,c]=d.split('-').map(Number);return new Date(a,b-1,c).toLocaleDateString('es-ES',{day:'numeric',month:'short'})};
  const range=dates.length?(dates[0]===dates[dates.length-1]?fmt(dates[0]):fmt(dates[0])+' – '+fmt(dates[dates.length-1])):'';
  const days=dates.length?Math.round((new Date(dates[dates.length-1])-new Date(dates[0]))/864e5)+1:0;
  return `<button class="back" id="back">‹ Viajes</button>
  <div class="monthnav" style="margin-top:4px"><h1 class="display" style="font-size:1.5rem">${t.emoji} ${esc(t.name)}</h1><button class="iconbtn" id="edit-trip" aria-label="Editar viaje">✎</button></div>
  <div class="total">${money(total)}</div>
  <div class="sub">${range?`<span>${range}</span>`:''}${days>1?`<span>${money(Math.round(total/days))} al día</span>`:''}<span>${list.length} ${list.length===1?'gasto':'gastos'}</span></div>
  ${stackHTML(groups,total)}
  <div class="row-actions"><button class="btn ${at&&at.id===t.id?'':'primary'}" id="toggle-active">${at&&at.id===t.id?'Terminar viaje':'Marcar como viaje activo'}</button></div>
  ${list.length?`<h2>A dónde va</h2>${catListHTML(groups,total)}<h2>Movimientos</h2>${expListHTML(list,false)}`
  :`<div class="empty" style="margin-top:20px"><b>Nada apuntado todavía</b>Márcalo como activo o elige este viaje al añadir un gasto.</div>`}`;
}
function render(){
  const app=$('app');
  if(state.tab==='viajes'){
    const t=state.trip&&docs.get(state.trip);
    app.innerHTML=t?renderTrip(t):renderTrips();
    if(!t)state.trip=null;
  } else app.innerHTML=renderMonth();
  $('tab-mes').setAttribute('aria-selected',state.tab==='mes');
  $('tab-viajes').setAttribute('aria-selected',state.tab==='viajes');
  wire();
}
function wire(){
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  on('prev',()=>{state.ym=shiftYm(state.ym,-1);render()});
  on('next',()=>{state.ym=shiftYm(state.ym,1);render()});
  on('new-trip',()=>openTrip());
  on('back',()=>{state.trip=null;render()});
  on('edit-trip',()=>openTrip(docs.get(state.trip)));
  on('toggle-active',()=>{
    const s={...settings()};s.activeTrip=s.activeTrip===state.trip?null:state.trip;put(s);
    toast(s.activeTrip?'Viaje activo':'Viaje terminado');
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openExpense(docs.get(b.dataset.edit)));
  document.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>{state.tab='viajes';state.trip=b.dataset.trip;render();window.scrollTo(0,0)});
  on('backup',openBackup);on('backup-banner',openBackup);
}

/* ---------- sheets ---------- */
function openSheet(html){
  $('sheet-body').innerHTML='<div class="grab"></div>'+html;
  $('sheet').classList.remove('hidden');$('backdrop').classList.remove('hidden');
  requestAnimationFrame(()=>{$('sheet').classList.add('open');$('backdrop').classList.add('open')});
}
function closeSheet(){
  $('sheet').classList.remove('open');$('backdrop').classList.remove('open');
  setTimeout(()=>{$('sheet').classList.add('hidden');$('backdrop').classList.add('hidden')},260);
}
$('backdrop').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function openExpense(ex){
  const edit=!!ex, at=activeTrip();
  const def=ex||{cat:'super',pay:'card',date:todayStr(),trip:state.tab==='viajes'&&state.trip?state.trip:(at?at.id:null),note:''};
  const ts=trips();
  openSheet(`
  <div class="sheet-head"><h3>${edit?'Editar gasto':'Nuevo gasto'}</h3><button class="iconbtn" id="x" aria-label="Cerrar">✕</button></div>
  <div class="amount-wrap"><input class="amount-in" id="amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Importe en euros" value="${edit?(((ex.split?ex.split.total:ex.amount))/100).toFixed(2).replace('.',','):''}"><span class="euro">€</span></div>
  <div class="cats" role="radiogroup" aria-label="Tipo de gasto">${CATS.map(c=>`<label><input type="radio" name="cat" value="${c.id}" ${def.cat===c.id?'checked':''}><span style="--c:${c.color}"><b>${c.emoji}</b>${c.name}</span></label>`).join('')}</div>
  <div class="seg" role="radiogroup" aria-label="Forma de pago">
    <label><input type="radio" name="pay" value="card" ${def.pay!=='cash'?'checked':''}><span>💳 Tarjeta</span></label>
    <label><input type="radio" name="pay" value="cash" ${def.pay==='cash'?'checked':''}><span>💶 Efectivo</span></label>
  </div>
  <label class="check"><input type="checkbox" id="split" ${def.split?'checked':''}> Reparto</label>
  <div class="splitbox ${def.split?'':'hidden'}" id="splitbox">
    <div class="stepper"><span>Entre cuántos (contándote)</span><div><button type="button" id="nminus" aria-label="Una persona menos">−</button><output id="n">${def.split?def.split.n:2}</output><button type="button" id="nplus" aria-label="Una persona más">+</button></div></div>
    <div class="splitres" id="splitres"></div>
  </div>
  <div class="fields">
    <label class="field"><span>Nota</span><input id="note" placeholder="Opcional: Mercadona, cena con…" value="${esc(def.note)}" maxlength="80"></label>
    <label class="field"><span>Fecha</span><input id="date" type="date" value="${def.date}"></label>
    ${ts.length?`<label class="field"><span>Viaje</span><select id="trip"><option value="">Ninguno</option>${ts.map(t=>`<option value="${esc(t.id)}" ${def.trip===t.id?'selected':''}>${t.emoji} ${esc(t.name)}</option>`).join('')}</select></label>`:''}
  </div>
  <button class="save" id="save" disabled>${edit?'Guardar cambios':'Guardar gasto'}</button>
  ${edit?'<button class="del" id="del">Borrar gasto</button>':''}`);
  const amt=$('amount');
  const parse=()=>{const v=parseFloat(amt.value.replace(/\s/g,'').replace(/\./g,m=>amt.value.includes(',')?'':m).replace(',','.'));return isFinite(v)&&v>0?Math.round(v*100):0};
  let n=def.split?def.split.n:2;
  const isSplit=()=>$('split').checked;
  const part=()=>isSplit()?Math.round(parse()/n):parse();
  const check=()=>{
    const t=parse();$('save').disabled=!t;
    $('n').textContent=n;
    $('splitres').innerHTML=t?`Tu parte: <b>${money(Math.round(t/n))}</b> de ${money(t)}`:'Escribe arriba el total que pagaste';
    $('save').textContent=(edit?'Guardar':'Guardar')+(t?' '+money(part()):' gasto');
  };
  $('split').onchange=()=>{$('splitbox').classList.toggle('hidden',!isSplit());check()};
  $('nminus').onclick=()=>{if(n>2){n--;check()}};
  $('nplus').onclick=()=>{if(n<50){n++;check()}};
  const size=()=>{amt.style.width=(Math.max(amt.value.length,1)*0.62+0.3)+'em'};
  amt.oninput=()=>{check();size()};check();size();
  amt.focus();
  $('x').onclick=closeSheet;
  $('save').onclick=()=>{
    const cents=parse();if(!cents)return;
    const sp=isSplit();
    const item={id:edit?ex.id:uid('e'),kind:'e',amount:sp?Math.round(cents/n):cents,split:sp?{total:cents,n}:null,
      cat:document.querySelector('input[name=cat]:checked').value,
      pay:document.querySelector('input[name=pay]:checked').value,
      date:$('date').value||todayStr(),note:$('note').value.trim(),
      trip:$('trip')?($('trip').value||null):null,created:edit?ex.created:Date.now()};
    put(item);closeSheet();
    if(!edit&&state.tab==='mes'&&item.date.slice(0,7)!==state.ym){state.ym=item.date.slice(0,7);render()}
    toast(edit?'Cambios guardados':'Gasto guardado');
  };
  if(edit)$('del').onclick=()=>{if(confirm('¿Borrar este gasto?')){removeDoc(ex.id);closeSheet();toast('Gasto borrado')}};
}

function openTrip(t){
  const edit=!!t, isActive=edit&&settings().activeTrip===t.id;
  openSheet(`
  <div class="sheet-head"><h3>${edit?'Editar viaje':'Nuevo viaje'}</h3><button class="iconbtn" id="x" aria-label="Cerrar">✕</button></div>
  <div class="fields"><label class="field"><span>Nombre</span><input id="tname" placeholder="Lisboa, Asturias…" maxlength="40" value="${esc(edit?t.name:'')}"></label></div>
  <div class="emojis" role="radiogroup" aria-label="Icono">${TRIP_EMOJIS.map((e,i)=>`<label><input type="radio" name="temoji" value="${e}" ${(edit?t.emoji===e:i===0)?'checked':''}><span>${e}</span></label>`).join('')}</div>
  <label class="check"><input type="checkbox" id="tactive" ${edit?(isActive?'checked':''):'checked'}> Viaje activo: los gastos nuevos van aquí</label>
  <button class="save" id="save" ${edit?'':'disabled'}>${edit?'Guardar cambios':'Crear viaje'}</button>
  ${edit?'<button class="del" id="del">Borrar viaje</button>':''}`);
  const n=$('tname');n.oninput=()=>{$('save').disabled=!n.value.trim()};
  if(!edit)n.focus();
  $('x').onclick=closeSheet;
  $('save').onclick=()=>{
    const name=n.value.trim();if(!name)return;
    const item={id:edit?t.id:uid('t'),kind:'t',name,emoji:document.querySelector('input[name=temoji]:checked').value,created:edit?t.created:Date.now()};
    put(item);
    const s={...settings()},want=$('tactive').checked;
    if(want&&s.activeTrip!==item.id){s.activeTrip=item.id;put(s)}
    else if(!want&&s.activeTrip===item.id){s.activeTrip=null;put(s)}
    closeSheet();state.tab='viajes';state.trip=item.id;render();
    toast(edit?'Cambios guardados':'Viaje creado');
  };
  if(edit)$('del').onclick=()=>{
    if(!confirm('¿Borrar el viaje? Los gastos se mantienen, solo dejan de estar asociados.'))return;
    expenses().filter(e=>e.trip===t.id).forEach(e=>put({...e,trip:null}));
    if(settings().activeTrip===t.id)put({...settings(),activeTrip:null});
    removeDoc(t.id);state.trip=null;closeSheet();render();toast('Viaje borrado');
  };
}

let toastT;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800)}

/* ---------- copia de seguridad ---------- */
function lastBackup(){try{return Number(localStorage.getItem(LSB))||0}catch(e){return 0}}
function needBackup(){
  const ex=expenses();if(ex.length<5)return false;
  const lb=lastBackup(), oldest=Math.min(...ex.map(e=>e.created||Date.now()));
  return Date.now()-(lb||oldest)>30*864e5;
}
async function shareOrDownload(name,text,type){
  const blob=new Blob([text],{type});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}
  }catch(e){if(e&&e.name==='AbortError')return false}
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  return true;
}
async function exportBackup(){
  const d=new Date(),stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const ok=await shareOrDownload('gastos-copia-'+stamp+'.json',JSON.stringify({app:'gastos',version:1,exported:d.toISOString(),items:[...docs.values()]}),'application/json');
  if(ok){try{localStorage.setItem(LSB,String(Date.now()))}catch(e){}closeSheet();render();toast('Copia creada')}
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;try{data=JSON.parse(r.result)}catch(e){toast('Ese archivo no es una copia válida');return}
    const items=(data&&Array.isArray(data.items))?data.items:null;
    if(!items||data.app!=='gastos'){toast('Ese archivo no es una copia de Gastos');return}
    const n=items.filter(i=>i&&i.kind==='e').length;
    if(!confirm('Se importarán '+n+' gastos. Los que ya tengas se mantienen. ¿Continuar?'))return;
    items.forEach(i=>{if(i&&i.id&&i.kind){if(i.id==='settings'&&docs.has('settings'))return;docs.set(i.id,i)}});
    saveLocal();closeSheet();render();toast(n+' gastos importados');
  };
  r.readAsText(file);
}
async function exportCsv(){
  const list=expenses().sort((a,b)=>a.date<b.date?-1:1);
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Fecha','Categoría','Nota','Pago','Viaje','Reparto','Importe'].join(';')].concat(list.map(e=>[e.date,q((CAT[e.cat]||CAT.otros).name),q(e.note),e.pay==='cash'?'Efectivo':'Tarjeta',q(e.trip&&docs.get(e.trip)?docs.get(e.trip).name:''),e.split?q((e.split.total/100).toFixed(2).replace('.',',')+' ÷ '+e.split.n):'',(e.amount/100).toFixed(2).replace('.',',')].join(';')));
  await shareOrDownload('gastos.csv','\ufeff'+rows.join('\n'),'text/csv');
}
function openBackup(){
  const lb=lastBackup();
  openSheet(`<div class="bk">
  <div class="sheet-head"><h3>Copia de seguridad</h3><button class="iconbtn" id="x" aria-label="Cerrar">✕</button></div>
  <p>Tus gastos se guardan solo en este iPhone. Guarda una copia en Archivos o iCloud Drive de vez en cuando por si borras la app o cambias de móvil.<br><br>${lb?'Última copia: '+new Date(lb).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'Aún no has hecho ninguna copia.'}</p>
  <button class="btn primary" id="bk-export">💾 Guardar copia</button>
  <label class="btn" for="bk-file" style="cursor:pointer">📥 Recuperar desde una copia</label>
  <input type="file" id="bk-file" accept=".json,application/json" class="hidden">
  <button class="btn" id="bk-csv">📊 Exportar todo en CSV (Excel)</button>
  </div>`);
  $('x').onclick=closeSheet;
  $('bk-export').onclick=exportBackup;
  $('bk-csv').onclick=exportCsv;
  $('bk-file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f)};
}

$('tab-mes').onclick=()=>{state.tab='mes';render();window.scrollTo(0,0)};
$('tab-viajes').onclick=()=>{state.tab='viajes';state.trip=null;render();window.scrollTo(0,0)};
$('btn-add').onclick=()=>openExpense();

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
